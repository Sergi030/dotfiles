# See https://wiki.hyprland.org/Configuring/Keywords/ for more

### start up
exec-once = kanshi
exec-once = swww-daemon
exec-once = swww img ~/Pictures/wallpapers/Pastel-Window.png
exec-once = waybar
exec-once = wl-clip-persist --clipboard regular
exec-once = systemctl --user start hyprpolkitagent

# Source after kanshi has set monitors
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/monitors.conf

# Set programs that you use
$terminal = alacritty
$fileManager = nautilus
$menu = rofi -show drun -theme $HOME/.config/rofi/launchers/type-2/style-1.rasi
#rofi -show drun

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,es
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = no

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(1d2021aa)
    col.inactive_border = rgba(1d2021aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 5

    blur {
        enabled = true
        size = 1
        passes = 1
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
    preserve_split = true # you probably want this
    smart_split = false # if enabled, allows a more precise control over the window split direction based on the cursor’s position. The window is conceptually divided into four triangles, and cursor’s triangle determines the split direction. This feature also turns on preserve_split.
    force_split = 2 # force_split	0 -> split follows mouse, 1 -> always split to the left (new = left or top) 2 -> always split to the right (new = right or bottom)
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
    disable_autoreload = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
#device {
#    name = epic-mouse-v1
#    sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrule = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
## TODO
#windowrule = suppressevent maximize, class:.* # You'll probably like this.


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, Return, exec, $terminal
bind = $SUPER_SHIFT, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, $fileManager
bind = $SUPER_SHIFT, SPACE, togglefloating,
bind = $mod, D, exec, $menu
bind = $mod, P, pseudo, # dwindle
bind = $mod, R, exec, hyprctl reload
bind = $mod, L, exec, hyprlock


# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d


bind = $mod,1,workspace,1
bind = $mod,2,workspace,2
bind = $mod,3,workspace,3
bind = $mod,4,workspace,4
bind = $mod,5,workspace,5
bind = $mod,6,workspace,6
bind = $mod,7,workspace,7
bind = $mod,8,workspace,8
bind = $mod,9,workspace,9
bind = $mod,0,workspace,10
bind = $mod,F1,workspace,11
bind = $mod,F2,workspace,12
bind = $mod,F3,workspace,13
bind = $mod,F4,workspace,14
bind = $mod,F5,workspace,15
bind = $mod,F6,workspace,16
bind = $mod,F7,workspace,17
bind = $mod,F8,workspace,18
bind = $mod,F9,workspace,19
bind = $mod,F10,workspace,20

# Move to workspace
bind = $SUPER_SHIFT,1,movetoworkspacesilent,1
bind = $SUPER_SHIFT,2,movetoworkspacesilent,2
bind = $SUPER_SHIFT,3,movetoworkspacesilent,3
bind = $SUPER_SHIFT,4,movetoworkspacesilent,4
bind = $SUPER_SHIFT,5,movetoworkspacesilent,5
bind = $SUPER_SHIFT,6,movetoworkspacesilent,6
bind = $SUPER_SHIFT,7,movetoworkspacesilent,7
bind = $SUPER_SHIFT,8,movetoworkspacesilent,8
bind = $SUPER_SHIFT,9,movetoworkspacesilent,9
bind = $SUPER_SHIFT,0,movetoworkspacesilent,10
bind = $SUPER_SHIFT,F1,movetoworkspacesilent,11
bind = $SUPER_SHIFT,F2,movetoworkspacesilent,12
bind = $SUPER_SHIFT,F3,movetoworkspacesilent,13
bind = $SUPER_SHIFT,F4,movetoworkspacesilent,14
bind = $SUPER_SHIFT,F5,movetoworkspacesilent,15
bind = $SUPER_SHIFT,F6,movetoworkspacesilent,16
bind = $SUPER_SHIFT,F7,movetoworkspacesilent,17
bind = $SUPER_SHIFT,F8,movetoworkspacesilent,18
bind = $SUPER_SHIFT,F9,movetoworkspacesilent,19
bind = $SUPER_SHIFT,F10,movetoworkspacesilent,20
bind = $SUPER_SHIFT,F11,movetoworkspacesilent,21
bind = $SUPER_SHIFT,F12,movetoworkspacesilent,22

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, F, fullscreen, 1
bind = $mod, S, togglefloating,
#bind = $mod, SHIFT, SPACE, togglefloating,

bind = $mod, R, submap, resize

submap = resize
binde = , H, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , LEFT, resizeactive, -10 0
binde = , RIGHT, resizeactive, 10 0
binde = , UP, resizeactive, 0 -10
binde = , DOWN, resizeactive, 0 10
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
submap = reset

# Mover ventanas con flechas
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, DOWN, movewindow, d
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, RIGHT, movewindow, r

bind = $mod, Q, killactive,

# set this to your leftmost monitor id, otherwise you have to move your cursor to the leftmost monitor
# before executing flameshot
#windowrule = monitor 1, class:^(flameshot)$

# ctrl-c to copy from the flameshot gui gives warped images sometimes, but
# setting the env fixes it
# Screenshot
bind = , Print, exec, grim -g "$(slurp -d)" /tmp/capture.png && satty --filename /tmp/capture.png --copy-command wl-copy
#bind = , Print, exec, /opt/flameshot/bin/flameshot gui
# Area selection, open in satty, copy to clipboard
#bind = , Print, exec, hyprshot -s -m region -o /tmp -f capture.png && satty --filename /tmp/capture.png --copy-command wl-copy


bind = SHIFT, Print, exec, flatpak run io.github.seadve.Kooha


bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

binde =, XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# Smart gaps: (no gaps when only)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule = match:workspace w[tv1], border_size 0, rounding 0, float off
windowrule = match:workspace f[1],  border_size 0, rounding 0, float off




#windowrule = float,title:^(flameshot)
#windowrule = move 0 0,title:^(flameshot)
#windowrule = suppressevent fullscreen,title:^(flameshot)
#
#windowrulev2 = fullscreen, class:^(com\.gabm\.satty)$

# Wayland/Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# Screen share dialog on bottom
# Screen sharing indicator (Google Meet, etc)
windowrule = match:initial_title ^.*is sharing your screen\.$, tag +screen-share-indicator
windowrule = match:initial_title ^.*is sharing a window\.$,   tag +screen-share-indicator
windowrule = match:tag screen-share-indicator, border_size 0
windowrule = match:tag screen-share-indicator, move (monitor_w-window_w-20) (monitor_h-window_h-20)

# File dialog detection
windowrule = match:initial_title ^.*Open File.*$,   tag +open-file-dialog
windowrule = match:initial_title ^.*Open Folder.*$, tag +open-file-dialog
windowrule = match:tag open-file-dialog, float on
windowrule = match:tag open-file-dialog, center on

# Rofi detection
windowrule = match:initial_title ^.*rofi.*$, tag +rofi
windowrule = match:tag rofi, float on
windowrule = match:tag rofi, center on

# Floating calculator
windowrule = match:class org.gnome.Calculator, tag +float
windowrule = match:tag float, float on
windowrule = match:tag float, center on

