auth {
    pam:enabled = true        # (opcional si solo quieres huella/contraseña)
    fingerprint:enabled = true
}


# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock.jpg
    # blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


# GENERAL
general {
    no_fade_in = true
    grace = 0
    disable_loading_bar = false
    hide_cursor = false
}


# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 22
    # font_family = SF Pro Display Bold
    position = 0, 240
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(240, 242, 244, 1)
    font_size = 120
    # font_family = SF Pro Display Bold
    position = 0, 350
    halign = center
    valign = center
}


# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/profile.png
    border_size = 40
    border_color = rgba(240, 245, 245, 0)
    size = 200
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 0
    halign = center
    valign = center
}


# USER
label {
    monitor =
    text = $USER
    color = rgba(240, 242, 244, 1)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 22
    position = 0, -160
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(67, 68, 75, .4)
    font_color = rgba(240, 242, 244, 1)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    hide_input = false
    position = 0, -260
    halign = center
    valign = center
    rounding = 10
}

