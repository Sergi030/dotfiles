[font]
normal.family = "Meslo LG M for Powerline"
normal.style = "Regular"
size = 12

[scrolling]
# Alacritty no admite scrollback infinito, pero puedes poner un valor alto
history = 100000

[cursor]
style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = false

[window]
dynamic_title = false


[colors.primary]
background = "#002b36"
foreground = "#839496"

[colors.cursor]
cursor = "#93a1a1"
text = "CellBackground"

[colors.normal]
black   = "#073642"
red     = "#dc322f"
green   = "#859900"
yellow  = "#b58900"
blue    = "#268bd2"
magenta = "#d33682"
cyan    = "#2aa198"
white   = "#eee8d5"

[colors.bright]
black   = "#002b36"
red     = "#cb4b16"
green   = "#586e75"
yellow  = "#657b83"
blue    = "#839496"
magenta = "#6c71c4"
cyan    = "#93a1a1"
white   = "#fdf6e3"


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"
